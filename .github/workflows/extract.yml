name: Extract clipforge zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip and move to root
        run: |
          set -eux
          unzip -o clipforge.zip
          ls -la
          ls -la clipforge || true
          if [ -f clipforge/.github/workflows/ci.yml ]; then cp clipforge/.github/workflows/ci.yml ./ci.yml; fi
          shopt -s dotglob nullglob
          for item in clipforge/* clipforge/.[!.]*; do
            base=$(basename "$item")
            if [ "$base" = ".github" ]; then continue; fi
            mv "$item" ./
          done
          rm -rf clipforge clipforge.zip
          ls -la
          find . -maxdepth 3 -type f | sort
      - name: Commit extracted tree
        run: |
          set -eux
          git config user.name "tahiryounas604"
          git config user.email "tahiryounas604@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Extract clipforge.zip to repo root (stage ci.yml at root)" || echo "nothing to commit"
          git push
